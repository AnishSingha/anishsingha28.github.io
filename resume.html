<div class="lightbox" id="lightbox"><button class="close" aria-label="Close">&times;</button><button class="prev" aria-label="Previous">&#8249;</button><img alt=""><button class="next" aria-label="Next">&#8250;</button></div>
<script>window.GALLERIES = {};</script>
<script>
(function () {
  var lb = document.getElementById('lightbox'), img = lb.querySelector('img'), list = [], i = 0;
  function show() { img.src = list[i]; lb.classList.add('open'); }
  function open(name, idx) { list = window.GALLERIES[name] || []; if (!list.length) return; i = idx || 0; show(); }
  document.querySelectorAll('[data-gallery]').forEach(function (el) {
    el.addEventListener('click', function (e) { e.preventDefault(); open(el.dataset.gallery, +el.dataset.index); });
  });
  lb.querySelector('.close').onclick = function () { lb.classList.remove('open'); };
  lb.querySelector('.prev').onclick = function (e) { e.stopPropagation(); i = (i + list.length - 1) % list.length; show(); };
  lb.querySelector('.next').onclick = function (e) { e.stopPropagation(); i = (i + 1) % list.length; show(); };
  lb.onclick = function (e) { if (e.target === lb) lb.classList.remove('open'); };
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowRight') lb.querySelector('.next').click();
    if (e.key === 'ArrowLeft') lb.querySelector('.prev').click();
  });
})();
</script>
